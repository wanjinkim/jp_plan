name: Collect licensed travel photos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download licensed location photos
        run: python scripts/download_photos.py
      - name: Commit obtained images and source details
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/new_routes.json assets/photo_tasks.json assets/photos PHOTO_LICENSES.json PHOTO_DOWNLOAD_REPORT.md PHOTO_DOWNLOAD_ERRORS.json
          git diff --staged --quiet || git commit -m "Add verified Wikimedia Commons travel photos with credits"
          git push
