name: Restore Osaka Naniwa no Yu exact facility photo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/complete_missing_naniwanoyu.py'
      - '.github/workflows/restore-osaka-photo.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JPEG verifier
        run: python -m pip install Pillow==11.3.0
      - name: Validate Python code
        run: python -m py_compile scripts/complete_missing_naniwanoyu.py
      - name: Recover the real exact-venue photo
        run: python -u scripts/complete_missing_naniwanoyu.py
      - name: Validate all 281 image files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          rows=json.loads(Path('assets/photo_manifest_281.json').read_text())
          ix=json.loads(Path('assets/local_schedule_photos.json').read_text())
          assert len(rows)==281 and len(ix)==281
          for row in rows:
            path=Path(row['local_path'])
            with Image.open(path) as image: image.verify()
            assert ix[row['key']].get('source'),row['key']
          print('ALL 281 IMAGES PRESENT AND DECODEABLE')
          PY
      - name: Commit restored photo and image mapping
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/schedules/osaka/d1-08.jpg assets/new_routes.json assets/local_schedule_photos.json photo_audit/naniwanoyu_rescue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore genuine Osaka Naniwa no Yu photograph'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
