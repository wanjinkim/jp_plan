name: FIX all itinerary images (licensed photos)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-all-itinerary-images.yml'
      - 'scripts/repair_all_schedule_photos.py'
permissions:
  contents: write
concurrency:
  group: japan-atlas-photo-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-image validator
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Network diagnostics
        continue-on-error: true
        run: |
          python - <<'PY'
          import urllib.request
          for host in ['https://commons.wikimedia.org/w/api.php?action=query&format=json&meta=siteinfo', 'https://api.openverse.org/v1/images/?q=Fukuoka%20Airport&page_size=1']:
              try:
                  req=urllib.request.Request(host,headers={'User-Agent':'JapanAtlasPhotoRepair/3.0 (https://github.com/wanjinkim/jphUQgQXoSnXM6VP5rSECCcbQQ0u8YWhY8LpIsBjpi)'})
                  with urllib.request.urlopen(req,timeout=15) as r:print('SOURCE OK',r.status,r.url)
              except Exception as ex:print('SOURCE ERROR',host.split('/')[2],str(ex))
          PY
      - name: Compile photo collector before running
        run: python -m py_compile scripts/repair_all_schedule_photos.py
      - name: Search unresolved venue images using Wikipedia + Wikidata + Commons
        run: |
          mkdir -p assets/photos/schedules
          python scripts/repair_all_schedule_photos.py
      - name: Build validated local photo index after downloads
        if: always()
        run: python scripts/build_local_photo_index.py
      - name: Validate local JPEG paths and source mappings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          rows=json.loads(Path('assets/photo_manifest_281.json').read_text())
          idx=json.loads(Path('assets/local_schedule_photos.json').read_text())
          assert len(rows)==281, f'Unexpected itinerary count: {len(rows)}'
          for k, r in idx.items():
              p=Path(r['url'].removeprefix('./'))
              assert p.is_file(), f'Missing photo for {k}: {p}'
              with Image.open(p) as im: im.verify()
          print(f'PHOTO COVERAGE: {len(idx)}/281, missing={281-len(idx)}')
          PY
      - name: Rebuild verified local photo index
        run: python scripts/build_local_photo_index.py
      - name: Commit all successfully downloaded photos immediately
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/local_schedule_photos.json assets/recommended.json assets/new_routes.json assets/gallery.json assets/photos/schedules PHOTO_REPAIR_REPORT.json PHOTO_REPAIR_STATUS.csv PHOTO_CREDITS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Fix locally stored itinerary photos and licensed credits'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No image files were downloaded; inspect SOURCE ERROR and PHOTO_REPAIR_REPORT.json'
          fi
      - name: Photo collection report and partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-repair-report-and-images
          path: |
            PHOTO_REPAIR_REPORT.json
            PHOTO_REPAIR_STATUS.csv
            PHOTO_CREDITS.md
            assets/photos/schedules/
          retention-days: 14
          if-no-files-found: warn
      - name: Job summary
        if: always()
        run: |
          python - <<'PY'
          import json,os
          fn='PHOTO_REPAIR_REPORT.json'
          if os.path.exists(fn):
              j=json.load(open(fn))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  f.write('## Image repair results\n\n')
                  f.write('Actual image files: '+str(j['counts'].get('downloaded',0)+j['counts'].get('existing',0))+'\n\n')
                  f.write('Unresolved: '+str(j['counts'].get('missing',0))+'\n\n')
                  f.write('Failed API sources: '+str(j.get('api_errors'))+'\n')
          PY
