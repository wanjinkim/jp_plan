name: Repair additional station buses, airport trains and hotel photographs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_curated_semantic_photos_round2.py'
      - '.github/workflows/apply-curated-semantic-photos-round2.yml'
permissions:
  contents: write
concurrency:
  group: japan-atlas-verified-semantic-photos
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Check Python syntax
        run: python -m py_compile scripts/apply_curated_semantic_photos_round2.py
      - name: Download manually reviewed subject-specific replacement photos
        run: python -u scripts/apply_curated_semantic_photos_round2.py
      - name: Validate 281 JPEGs are readable, sourced, and binary-unique
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          m=json.loads(Path('assets/photo_manifest_281.json').read_text())
          idx=json.loads(Path('assets/local_schedule_photos.json').read_text())
          assert len(m)==len(idx)==281
          shas=set()
          for r in m:
            p=Path(r['local_path'])
            with Image.open(p) as im: im.verify()
            h=hashlib.sha256(p.read_bytes()).hexdigest()
            assert h not in shas, f'Duplicate image at {r["key"]}'
            shas.add(h)
            assert idx[r['key']].get('source'),f'Missing source at {r["key"]}'
          report=json.loads(Path('photo_audit/final_semantic_replacements_round2.json').read_text())
          print('281/281 JPEGs readable and SHA unique; semantic replacements:', report['replaced'],'/',report['total'])
          PY
      - name: Commit independently source-checked photo replacements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/photos/schedules assets/local_schedule_photos.json assets/recommended.json assets/new_routes.json assets/gallery.json photo_audit/final_semantic_replacements_round2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Fix itinerary/photo mismatches using individually verified licensed photographs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Require all selected replacements to be verified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('photo_audit/final_semantic_replacements_round2.json').read_text())
          for x in r['items']:
            if x['status']!='REPLACED': print('UNRESOLVED:',x)
          assert r['unresolved']==0,'Some curated images could not be acquired; do not claim completion'
          PY
