<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAPAN ATLAS · 전체 일정 사진 검증</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f5;color:#282c30;font:15px/1.6 system-ui,-apple-system,'Malgun Gothic',sans-serif}header{background:white;border-bottom:1px solid #ddd;padding:20px max(16px,calc((100vw - 1150px)/2))}h1{font-size:23px;margin:0 0 6px}.sub{color:#676d75;font-size:13px;margin:0}.wrap{max-width:1150px;margin:20px auto;padding:0 16px}.bar{display:flex;flex-wrap:wrap;gap:12px;background:white;padding:15px;border-radius:12px;margin-bottom:22px;align-items:center;border:1px solid #eee}.bar strong{font-size:20px}.bar select{padding:10px;border-radius:8px;border:1px solid #ddd;margin-left:auto}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:15px}.card{border:1px solid #e2e2e2;border-radius:14px;background:white;padding:10px;overflow:hidden}.card img{width:100%;height:170px;object-fit:contain;background:#eee;border-radius:9px}.missing{height:170px;display:grid;place-items:center;color:#6b6f79;background:#ededed;border-radius:9px}.card h2{font-size:15px;margin:10px 0 0}.muted{color:#787d86;font-size:12px}.status{font-size:12px;color:#ae4a2f}.status.ok{color:#207e5b}a{color:inherit}.notice{border-left:3px solid #a85e42;padding:8px 15px;margin-bottom:20px;background:white}</style></head>
<body><header><h1>JAPAN ATLAS · 사진 281건 전체 검증</h1><p class="sub">일정 제목·장소·저장 이미지의 실제 로딩을 함께 확인합니다. 원본과 참고사진을 구분해 검수하세요.</p></header><div class="wrap"><p class="notice">일정 관련 사진 후보가 검색되지 않거나 저장되지 않은 경우에는 '미확보'로 표시합니다. 출처 없이 엉뚱한 사진을 대신 삽입하지 않습니다.</p><div class="bar"><div>전체 <strong id="all">281</strong></div><div>다운로드/기존 <strong id="found">0</strong></div><div>미확보 <strong id="missing">281</strong></div><select id="filter" aria-label="도시 선택"><option value="all">전체 도시</option></select></div><div class="cards" id="cards"></div></div>
<script>
(async()=>{const $=s=>document.querySelector(s); const [index,report]=await Promise.all([fetch('./assets/photo-keywords-281.json').then(r=>r.json()),fetch('./PHOTO_REPAIR_REPORT.json').then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]}))]);const byId=new Map((report.items||[]).map(x=>[x.id,x]));const all=Object.entries(index.items);const cities=[...new Set(all.map(([k,x])=>x.city))];cities.forEach(c=>{$('#filter').add(new Option(c,c));});$('#found').textContent=all.filter(([k])=>['downloaded','existing'].includes(byId.get(k)?.status)).length;$('#missing').textContent=all.length-Number($('#found').textContent);$('#all').textContent=all.length;function draw(){const city=$('#filter').value;$('#cards').textContent='';for(const [id,t] of all){if(city!=='all'&&t.city!==city)continue;const rec=byId.get(id),found=['downloaded','existing'].includes(rec?.status);const box=document.createElement('article');box.className='card';const media=document.createElement(found?'img':'div');if(found){media.loading='lazy';media.alt=t.place+' 일정 검색 사진';media.src='./assets/photos/schedules/'+t.city+'/'+id.match(/d\d+-\d+/)[0]+'.jpg';media.onerror=()=>{const fail=document.createElement('div');fail.className='missing';fail.textContent='이미지 파일 로딩 실패';media.replaceWith(fail);};}else{media.className='missing';media.textContent='사진 미확보';}box.append(media);const title=document.createElement('h2');title.textContent=id+' · '+(t.place||t.title);box.append(title);const desc=document.createElement('div');desc.className='muted';desc.textContent=t.title;box.append(desc);const status=document.createElement('div');status.className=found?'status ok':'status';status.textContent=found?'파일 있음 · 이미지 로딩 검사 중':'미확보 · 검색 필요';box.append(status);if(rec?.source){let source=document.createElement('a');source.href=rec.source;source.textContent='원본 사진 출처 확인';source.target='_blank';source.rel='noopener noreferrer';box.append(source);}$('#cards').append(box);} }$('#filter').addEventListener('change',draw);draw();})().catch(e=>{document.querySelector('#cards').textContent='검사 데이터 로딩 오류: '+e.message;});
</script></body></html>
